[build]
  publish = "."

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://images.pexels.com; style-src 'self' 'unsafe-inline'; img-src 'self' https://images.pexels.com data:; connect-src 'self' https://api.pexels.com; font-src 'self' data:;"
